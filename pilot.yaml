# LDT4SSC pilot metadata
#
# This file describes the NeWG+ pilot at a glance and is read by the LDT4SSC
# aggregator to know what the pilot is and how to present it on the
# Knowledge Hub and the project website.

schema_version: 1

# Short name of the pilot, in lowercase with hyphens (used in URLs)
short_name: newg

# Human-readable name of the pilot
name: NeWG+

# Short description of the pilot (one or two sentences)
description: >
  A two-scale digital twin pilot connecting a major wholesale food market in
  Madrid (Mercamadrid) with a medium-sized producer city in Lombardy (Codogno)
  to transform agrifood logistics and commerce into reusable, governed public
  digital infrastructure.

# LDT4SSC work strand: WS1, WS2, or WS3
work_strand: WS1

# The cities, regions, or communities involved in this pilot
locations:
  - city: Madrid
    country: Spain
    country_code: ES
  - city: Codogno
    country: Italy
    country_code: IT

# The thematic focus areas of the pilot
focus_areas:
  - Fresh-food logistics optimisation
  - Governed data publishing
  - Agrifood corridor simulation & planning

# The consortium members participating in this pilot
consortium:
  - name: Ayuntamiento de Madrid - Dirección General de la Oficina Digital (DGOD)
    role: Pilot lead
    country_code: ES
    website: https://www.madrid.es
  - name: Comune di Codogno
    role: Public authority
    country_code: IT
    website: https://www.comune.codogno.lo.it
  - name: capillar IT
    role: Technology partner & Technical coordinator
    country_code: ES
    website: https://capillar.it
  - name: SEAMWARE
    role: Technology partner
    country_code: ES
    website: https://seamware.com
  - name: Mines Paris - PSL
    role: Research
    country_code: FR
    website: https://www.minesparis.psl.eu
  - name: Politecnico di Milano (POLIMI)
    role: Research
    country_code: IT
